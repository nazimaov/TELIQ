# Релиз по тегу v*: подписанный APK прикладывается к релизу GitHub — из этих релизов приложение обновляет себя.
# Секреты репозитория: TELIQ_KEYSTORE_BASE64, TELIQ_KEYSTORE_PASSWORD, TELIQ_KEY_ALIAS, TELIQ_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches version
        run: |
          VERSION=$(grep '^teliq.versionName=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с teliq.versionName=$VERSION в gradle.properties"; exit 1
          fi

      - name: Restore signing key
        env:
          TELIQ_KEYSTORE_BASE64: ${{ secrets.TELIQ_KEYSTORE_BASE64 }}
        run: |
          echo "$TELIQ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teliq-release.jks"
          echo "TELIQ_KEYSTORE=$RUNNER_TEMP/teliq-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          TELIQ_KEYSTORE_PASSWORD: ${{ secrets.TELIQ_KEYSTORE_PASSWORD }}
          TELIQ_KEY_ALIAS: ${{ secrets.TELIQ_KEY_ALIAS }}
          TELIQ_KEY_PASSWORD: ${{ secrets.TELIQ_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(grep '^teliq.versionName=' gradle.properties | cut -d= -f2 | tr -d '\r')
          cp app/build/outputs/apk/release/app-release.apk "TELIQ-$VERSION.apk"
          echo "APK=TELIQ-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^teliq.versionName=' gradle.properties | cut -d= -f2 | tr -d '\r')
          # «Что нового» в окне обновления: docs/releases/<версия>.md с разделами ## ru и ## en; нет файла — текст коммита с тегом
          if [ -f "docs/releases/$VERSION.md" ]; then
            cp "docs/releases/$VERSION.md" "$RUNNER_TEMP/notes.md"
          else
            git log -1 --format=%B "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$APK" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
